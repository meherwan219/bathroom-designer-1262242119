version: "3.9"

services:
  db:
    image: ankane/pgvector:latest
    container_name: kohler_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: kohler
      POSTGRES_PASSWORD: kohler_dev
      POSTGRES_DB: kohler
    ports:
      - "5432:5432"
    volumes:
      - kohler_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kohler -d kohler"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    container_name: kohler_api
    restart: unless-stopped
    env_file:
      - ./apps/api/.env.example
    environment:
      DATABASE_URL: postgresql+psycopg://kohler:kohler_dev@db:5432/kohler
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build:
      context: ./apps/web
    container_name: kohler_web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    command: npm run dev

volumes:
  kohler_pgdata:
